# Shopkeep self-hosted deployment — the reference two-container topology
# (vault: Decisions D4). Copy this file + .env to your host, fill .env, then:
#
#   docker compose up -d
#
# Optional profiles:
#   --profile backup   nightly pg_dump with rotation (vault: D12 — strongly recommended)
#   --profile cups     CUPS bridge for USB printers (vault: D13)
services:
  app:
    image: ghcr.io/r0adkll/shopkeep:latest
    restart: unless-stopped
    ports:
      - "${SHOPKEEP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-shopkeep}
      DATABASE_USER: ${POSTGRES_USER:-shopkeep}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set in .env}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?set in .env — BACK THIS UP with your database}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-5}
      VIEW_SYNC_COOLDOWN_SECONDS: ${VIEW_SYNC_COOLDOWN_SECONDS:-60}
      ORDER_ARCHIVE_DAYS: ${ORDER_ARCHIVE_DAYS:-30}
      MEDIA_DIR: /data/media
    volumes:
      # Large media (listing videos) — mirror-tier state, re-pullable from
      # Etsy (vault: D21). Back up with e.g.
      #   docker run --rm -v shopkeep-media:/m -v ./backups:/b alpine tar czf /b/media.tar.gz -C /m .
      - shopkeep-media:/data/media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopkeep}
      POSTGRES_USER: ${POSTGRES_USER:-shopkeep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - shopkeep-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopkeep}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Nightly pg_dump with 14-day rotation. Postgres holds all IRREPLACEABLE
  # Shopkeep state (orders, ledger, PDFs, images), so this dump restores a
  # working shop — but two things live beside it (vault: D12/D21):
  #   - TOKEN_ENCRYPTION_KEY in your .env (or storefronts re-authenticate)
  #   - the shopkeep-media volume (listing videos; mirror-tier — a restore
  #     without it degrades gracefully and can re-pull from Etsy)
  backup:
    image: postgres:16
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint:
      - bash
      - -c
      # The marker ping uses bash's /dev/tcp because the postgres image
      # ships no curl/wget; failure to ping never blocks the dump loop.
      - |
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          if pg_dump -h db -U ${POSTGRES_USER:-shopkeep} ${POSTGRES_DB:-shopkeep} | gzip > "/backups/shopkeep-$$ts.sql.gz"; then
            echo "backup written: shopkeep-$$ts.sql.gz"
            ls -1t /backups/shopkeep-*.sql.gz | tail -n +15 | xargs -r rm --
            (exec 3<>/dev/tcp/app/8080 \
              && printf 'POST /api/v1/system/backup-marker HTTP/1.1\r\nHost: app\r\nContent-Length: 0\r\nConnection: close\r\n\r\n' >&3 \
              && cat <&3 >/dev/null) || echo "backup-marker ping failed (non-fatal)"
          else
            echo "pg_dump FAILED"
          fi
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  shopkeep-db:
  shopkeep-media:
