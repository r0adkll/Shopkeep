# Dev-container topology (vault: Decisions D15) — mirrors production's two-container
# shape (D4): one workspace, one Postgres sidecar. Optional profiles add the OIDC
# test provider (D10) and, later, a CUPS print bridge (D13).
services:
  workspace:
    image: mcr.microsoft.com/devcontainers/base:ubuntu-24.04
    volumes:
      - ..:/workspaces/shopkeep:cached
      # Isolate node_modules from the host checkout: platform-specific native
      # binaries (rollup, esbuild) differ between macOS and the Linux container,
      # and a shared directory lets each side clobber the other's install.
      - web-node-modules:/workspaces/shopkeep/web/node_modules
    command: sleep infinity
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopkeep
      POSTGRES_USER: shopkeep
      POSTGRES_PASSWORD: shopkeep-dev
    ports:
      - "5432:5432"
    volumes:
      - shopkeep-dev-db:/var/lib/postgresql/data

  # OIDC test provider for exercising the D10 login flow.
  # Runs in the workspace's network namespace so its issuer URL
  # (http://localhost:5556) is valid for BOTH the in-container server and,
  # via VS Code port forwarding, the host browser.
  dex:
    image: ghcr.io/dexidp/dex:latest
    profiles: ["oidc"]
    network_mode: "service:workspace"
    volumes:
      - ./dex-config.yaml:/etc/dex/config.docker.yaml:ro
    depends_on:
      - workspace

volumes:
  shopkeep-dev-db:
  web-node-modules:
