# Dex OIDC test provider — dev only, never production.
# Exercises Shopkeep's env-configured OIDC login (vault: Decisions D10, Users & Auth).
issuer: http://localhost:5556

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

staticClients:
  - id: shopkeep-dev
    redirectURIs:
      - "http://localhost:8080/api/v1/auth/oidc/callback"
      # Dev-loop variant: callback through the Vite proxy so the post-login
      # redirect lands on the SPA (BASE_URL=http://localhost:5173)
      - "http://localhost:5173/api/v1/auth/oidc/callback"
    name: "Shopkeep (dev)"
    secret: shopkeep-dev-secret

enablePasswordDB: true
staticPasswords:
  - email: "dev@shopkeep.local"
    # bcrypt of "password"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: dev
    userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
